<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --chee-base: #302e2b;
      --chee-surface0: #3d3b38;
      --chee-surface1: #4a4845;
      --chee-overlay0: #6b6966;
      --chee-subtext0: #a09d99;
      --chee-text: #c8c5c0;
      --chee-green: #81b64c;
    }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      margin: 0;
      color: var(--chee-text);
      background: var(--chee-base);
    }
    h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--chee-text);
    }
    #chee-version {
      font-size: 10px;
      font-weight: 400;
      color: var(--chee-subtext0);
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 13px;
      color: var(--chee-subtext0);
    }
    .btn-group {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .btn-group button {
      flex: 1;
      padding: 5px 0;
      background: var(--chee-surface0);
      color: var(--chee-overlay0);
      border: 1px solid var(--chee-surface1);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .btn-group button:hover { background: var(--chee-surface1); color: var(--chee-text); }
    .btn-group button.active {
      background: var(--chee-green);
      color: var(--chee-base);
      border-color: var(--chee-green);
    }
    .chee-toggle-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 12px;
      color: var(--chee-subtext0);
      cursor: pointer;
    }
    .chee-toggle-row input[type="checkbox"] {
      accent-color: var(--chee-green);
      cursor: pointer;
      margin: 0;
    }
    .chee-toggle-row .icon {
      font-size: 14px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .chee-section-header {
      font-size: 10px;
      font-weight: 600;
      color: var(--chee-overlay0);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 6px 0 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--chee-surface1);
    }
    .copy-debug-btn {
      width: 100%;
      padding: 5px 0;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--chee-surface1);
      border-radius: 4px;
      background: var(--chee-surface0);
      color: var(--chee-overlay0);
      transition: background 0.15s, color 0.15s;
    }
    .copy-debug-btn:hover {
      background: var(--chee-surface1);
      color: var(--chee-text);
    }
    .copy-debug-btn.copied {
      color: var(--chee-green);
      border-color: var(--chee-green);
    }
  </style>
</head>
<body>
  <h3>Chee <span id="chee-version"></span></h3>

  <div class="chee-section-header">Engine</div>

  <label>Depth</label>
  <div class="btn-group" data-key="searchDepth">
    <button data-val="12">12</button>
    <button data-val="15">15</button>
    <button data-val="18">18</button>
    <button data-val="20">20</button>
  </div>

  <label class="chee-toggle-row" title="Enable debug logging in console (chee:*)">
    <input type="checkbox" data-key="debugMode">
    <span class="icon">&#128736;</span> Debug
  </label>

  <button id="copy-debug" class="copy-debug-btn" title="Copy diagnostic info to clipboard for AI debugging">
    &#128203; Copy debug info
  </button>

  <script src="popup.js"></script>
</body>
</html>
